name: Verify integration Workers
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:phone-voice
      - run: npm run test:voice-edge
      - run: npm run test:voice-campaign
      - run: npm run test:voice-timings
      - run: npm run test:voice-handoff
      - run: npm run build
      - run: npm audit --omit=dev
